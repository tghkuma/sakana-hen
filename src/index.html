<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta property="og:image" content="%VITE_SITE_URL%/images/thumbnail.png">
<title>「さかなへん」クイズ</title>
<script type="module">
import { SakanaHen } from './js';
/**
* 起動時処理
*/
onload = function() {
	// さかなへんクイズ本体
	new SakanaHen("id_canvas");
}
</script>
<style>
:root {
  /** 最大表示幅 (タブレット・PC 向け) */
  --canvas-max-width: 600px;
  /** キャンバスの縦横比 (幅/高さ)。sakana.ts の CANVAS_WIDTH / CANVAS_HEIGHT と合わせること */
  --canvas-aspect: 0.8;
  /** ノッチ等を除いた表示可能領域 */
  --safe-width: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
  --safe-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}
/** ブラウザのツールバー表示/非表示に追従する dvh が使える場合はそちらを使う */
@supports (height: 100dvh) {
  :root {
    --safe-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  }
}
/**
 * ページ自体はスクロールさせない
 * (アプリ内ブラウザ等でスクロールに連動してツールバーが出入りし、表示サイズが変わるのを防ぐ)
 */
html,
body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}
body {
  margin: 0;
  /** 長押しコピー禁止 */
  -webkit-user-select: none;
  user-select: none;
}
/** キャンバスを画面の上下左右中央に配置する */
#container {
  position: fixed;
  inset: 0;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#id_canvas {
  display: block;
  /**
   * 縦横比を保ったまま、画面幅・画面高さ・最大幅に収まる最大サイズで表示する
   * 内部解像度・クリック座標は表示サイズに合わせてスクリプト側で自動補正される
   */
  width: min(var(--safe-width), calc(var(--safe-height) * var(--canvas-aspect)), var(--canvas-max-width));
  height: auto;
  aspect-ratio: var(--canvas-aspect);
  background-color: #fff0f0;
  /** ダブルタップ・ピンチによる拡大やスクロールを抑止 (タップの click は発生する) */
  touch-action: none;
  /** 選択ハイライト禁止 */
  -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
}
#version {
  position: absolute;
  top: 0;
  left: 0;
  color: transparent;
  pointer-events: none;
}
</style>
</head>
<body>
<div id="container">
<!-- 描画領域 -->
<canvas id="id_canvas">
非対応ブラウザです。
</canvas>
<div id="version">x.xx</div>
</div>
</body>
</html>
